name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node --test tests/bank-import.test.mjs tests/kaspi-pdf.test.mjs tests/telegram-reset-dedupe.test.mjs
      - run: npm run build
